services:
  db:
    image: postgres:15-alpine
    container_name: quant-postgres
    restart: always
    environment:
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: quant_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: